# Azure App Service + Aiven MySQL configuration. Use safe defaults so local startup does not fail while env vars are still being set.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:point_of_sale_db}?sslMode=REQUIRED
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production JWT signing key must be supplied by Azure App Service configuration, but keep a safe fallback for local container startup.
jwt.secret=${JWT_SECRET:production-signing-key-change-me}

# Configure the deployed frontend origins in Azure App Service and Netlify.
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:https://secupos.netlify.app,https://www.secupos.netlify.app}
