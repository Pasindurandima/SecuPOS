# Azure App Service + Aiven MySQL configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?sslMode=REQUIRED
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production JWT signing key must be supplied by Azure App Service configuration, but keep a safe fallback for local container startup.
jwt.secret=${JWT_SECRET:production-signing-key-change-me}

# Configure the deployed frontend origin in Azure App Service.
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}
