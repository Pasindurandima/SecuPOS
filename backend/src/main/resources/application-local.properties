# Local MySQL configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:point_of_sale_db}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Supply a local development signing key through the environment, with a safe fallback for local startup.
jwt.secret=${JWT_SECRET:local-development-signing-key-change-me}

# Existing local frontend development origins plus the deployed Netlify frontend.
cors.allowed.origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,https://secupos.netlify.app,https://www.secupos.netlify.app
