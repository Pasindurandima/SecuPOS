name: Frontend CI and Netlify Deploy

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'netlify.toml'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'netlify.toml'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint when configured
        shell: bash
        run: |
          if npm run | grep -qE '^  lint'; then npm run lint; else echo 'No lint script configured'; fi

      - name: Run tests when configured
        shell: bash
        run: |
          if npm run | grep -qE '^  test'; then npm test -- --run; else echo 'No test script configured'; fi

      - name: Build frontend
        run: npm run build

      - name: Validate Netlify deployment secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN" || { echo "Missing NETLIFY_AUTH_TOKEN GitHub secret"; exit 1; }
          test -n "$NETLIFY_SITE_ID" || { echo "Missing NETLIFY_SITE_ID GitHub secret"; exit 1; }

      - name: Deploy to Netlify from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
