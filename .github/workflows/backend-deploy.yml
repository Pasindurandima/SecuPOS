name: Backend Deploy to Azure App Service

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    env:
      RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
      WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$RESOURCE_GROUP" || {
            echo "Missing AZURE_RESOURCE_GROUP GitHub secret"
            exit 1
          }

          test -n "$WEBAPP_NAME" || {
            echo "Missing AZURE_WEBAPP_NAME GitHub secret"
            exit 1
          }

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Spring Boot application
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure App Service
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --linux-fx-version "JAVA|17-java17"

      - name: Configure App Service settings
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --settings \
              WEBSITES_PORT=8080 \
              SPRING_PROFILES_ACTIVE=prod \
              MYSQL_HOST="$MYSQL_HOST" \
              MYSQL_PORT="$MYSQL_PORT" \
              MYSQL_DATABASE="$MYSQL_DATABASE" \
              MYSQL_USERNAME="$MYSQL_USERNAME" \
              MYSQL_PASSWORD="$MYSQL_PASSWORD" \
              JWT_SECRET="$JWT_SECRET" \
              FRONTEND_URL="$FRONTEND_URL"

      - name: Deploy JAR to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: backend/target/*.jar

      - name: Restart App Service
        run: |
          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME"

      - name: Resolve App Service hostname
        id: app-service
        shell: bash
        run: |
          DEFAULT_HOSTNAME=$(az webapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --query defaultHostName \
            --output tsv)

          test -n "$DEFAULT_HOSTNAME" || {
            echo "Azure returned no App Service default hostname"
            exit 1
          }

          echo "health_url=https://${DEFAULT_HOSTNAME}/api/actuator/health" >> "$GITHUB_OUTPUT"

      - name: Verify health endpoint
        shell: bash
        env:
          HEALTH_URL: ${{ steps.app-service.outputs.health_url }}
        run: |
          echo "Checking: $HEALTH_URL"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            "$HEALTH_URL"