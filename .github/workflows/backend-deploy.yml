name: Backend Deploy to Azure App Service

on:
  workflow_run:
    workflows: ["Backend CI", "Backend Docker Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["Backend CI","Backend Docker Build"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    environment: production
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
    steps:
      - name: Checkout CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment variables
        shell: bash
        run: |
          test -n "$RESOURCE_GROUP" || { echo "Missing AZURE_RESOURCE_GROUP repository variable"; exit 1; }
          test -n "$WEBAPP_NAME" || { echo "Missing AZURE_WEBAPP_NAME repository variable"; exit 1; }
          test -n "$ACR_NAME" || { echo "Missing ACR_NAME repository variable"; exit 1; }
          test -n "$ACR_LOGIN_SERVER" || { echo "Missing ACR_LOGIN_SERVER repository variable"; exit 1; }

      - name: Ensure CI and Docker checks succeeded
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          for workflow_name in "Backend CI" "Backend Docker Build"; do
            status=$(gh run list --repo "${{ github.repository }}" --limit 50 --json name,headSha,conclusion | \
              jq -r --arg sha "${HEAD_SHA}" --arg name "${workflow_name}" '.[] | select(.headSha == $sha and .name == $name) | .conclusion' | head -n 1)

            if [[ "${status}" != "success" ]]; then
              echo "Required workflow '${workflow_name}' did not succeed for ${HEAD_SHA}."
              exit 1
            fi
          done

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and push backend image
        env:
          IMAGE: ${{ env.ACR_LOGIN_SERVER }}/secupos-backend:${{ github.event.workflow_run.head_sha || github.sha }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure App Service container
        env:
          IMAGE: ${{ env.ACR_LOGIN_SERVER }}/secupos-backend:${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --generic-configurations '{"acrUseManagedIdentityCreds": true}'
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-image-name "$IMAGE" \
            --container-registry-url "https://$ACR_LOGIN_SERVER"
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --settings WEBSITES_PORT=8080 SPRING_PROFILES_ACTIVE=prod

      - name: Restart App Service
        run: az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"

      - name: Verify health endpoint
        shell: bash
        env:
          HEALTH_URL: ${{ vars.AZURE_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="https://${WEBAPP_NAME}.azurewebsites.net/api/actuator/health"
          fi
          curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-connrefused "$HEALTH_URL"
